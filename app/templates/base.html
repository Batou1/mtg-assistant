<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MTG Assistant{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🃏 MTG Assistant</a>

    <div class="topbar-right">
      <nav>
        <a href="/">Accueil</a>
        <a href="/chat">💬 Chat</a>
        <a href="/collection">Ma collection</a>
      </nav>

      {% if profile %}
      <div class="profile-area">
        <form method="post" action="/profiles/switch" class="profile-switch" title="Profil actif">
          <span class="profile-icon">👤</span>
          <select name="profile_id" onchange="this.form.submit()" aria-label="Profil">
            {% for p in profiles %}
              <option value="{{ p.id }}" {% if p.id == profile.id %}selected{% endif %}>{{ p.name }}</option>
            {% endfor %}
          </select>
        </form>

        <details class="profile-menu">
          <summary aria-label="Gérer les profils">⚙</summary>
          <div class="profile-dropdown">
            <form method="post" action="/profiles/create" class="row">
              <input name="name" placeholder="Nouveau profil" maxlength="40" required>
              <button type="submit">Créer</button>
            </form>
            <form method="post" action="/profiles/delete"
                  onsubmit="return confirm('Supprimer le profil « {{ profile.name }} » et sa collection ?');">
              <input type="hidden" name="profile_id" value="{{ profile.id }}">
              <button type="submit" class="danger-link">Supprimer « {{ profile.name }} »</button>
            </form>
          </div>
        </details>
      </div>
      {% endif %}
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    Données : <a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a>
    &amp; <a href="https://edhrec.com" target="_blank" rel="noopener">EDHREC</a> ·
    LLM : Claude (Anthropic) · Prix Cardmarket (EUR)
  </footer>
</body>
</html>
