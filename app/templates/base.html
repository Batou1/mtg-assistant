<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MTG Assistant{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/style.css?v={{ static_v }}">
  <script>
    // Applied before paint to avoid a flash of the wrong theme/card-view.
    (function () {
      var saved = localStorage.getItem("mtg-theme");
      var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);

      var view = localStorage.getItem("mtg-card-view") === "text" ? "text" : "image";
      document.documentElement.setAttribute("data-card-view", view);
    })();
  </script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">✦</span>MTG Assistant</a>

    <nav class="topnav">
      <a href="/">Accueil</a>
      <a href="/chat">Chat</a>
      <a href="/build">Depuis une liste</a>
      <a href="/collection">Ma collection</a>
    </nav>

    <div class="topbar-right">
      <button type="button" class="theme-toggle card-view-toggle" onclick="mtgToggleCardView()" aria-label="Basculer images / texte">
        <span class="icon-cv-image">🖼</span><span class="icon-cv-text">📄</span>
        <span class="tt-label" data-cv-label>Images</span>
      </button>

      <button type="button" class="theme-toggle" onclick="mtgToggleTheme()" aria-label="Changer de thème">
        <span class="icon-moon">☾</span><span class="icon-sun">☀</span>
        <span class="tt-label" data-tt-label>Sombre</span>
      </button>

      {% if profile %}
        <div class="profile-area">
          <form method="post" action="/profiles/switch" class="profile-switch" title="Profil actif">
            <span class="profile-avatar">{{ profile.name[0]|upper }}</span>
            <select name="profile_id" onchange="this.form.submit()" aria-label="Profil">
              {% for p in profiles %}
                <option value="{{ p.id }}" {% if p.id == profile.id %}selected{% endif %}>{{ p.name }}</option>
              {% endfor %}
            </select>
          </form>

          <details class="profile-menu">
            <summary aria-label="Gérer les profils">⚙</summary>
            <div class="profile-dropdown">
              <form method="post" action="/profiles/create" class="row">
                <input name="name" placeholder="Nouveau profil" maxlength="40" required>
                <button type="submit">Créer</button>
              </form>
              <form method="post" action="/profiles/delete"
                    onsubmit="return confirm('Supprimer le profil « {{ profile.name }} » et sa collection ?');">
                <input type="hidden" name="profile_id" value="{{ profile.id }}">
                <button type="submit" class="danger-link">Supprimer « {{ profile.name }} »</button>
              </form>
            </div>
          </details>
        </div>
      {% endif %}
    </div>
  </header>

  <main class="{% block main_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    Données : <a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a>
    &amp; <a href="https://edhrec.com" target="_blank" rel="noopener">EDHREC</a> ·
    LLM : Claude (Anthropic) · Prix Cardmarket (EUR)
    <span class="version">v{{ app_version }}</span>
  </footer>

  <script>
    // Highlight the nav link matching the current page.
    (function () {
      var path = window.location.pathname;
      document.querySelectorAll(".topbar nav a").forEach(function (a) {
        var href = a.getAttribute("href");
        var match = href === "/" ? path === "/" : path.indexOf(href) === 0;
        if (match) a.classList.add("active");
      });
    })();

    // Theme toggle: persisted in localStorage, applied on <html data-theme>.
    function mtgSyncThemeLabel() {
      var theme = document.documentElement.getAttribute("data-theme");
      document.querySelectorAll("[data-tt-label]").forEach(function (el) {
        el.textContent = theme === "light" ? "Clair" : "Sombre";
      });
    }
    function mtgToggleTheme() {
      var next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("mtg-theme", next);
      mtgSyncThemeLabel();
    }
    mtgSyncThemeLabel();

    // Card view toggle: images vs text, applies globally (collection grid,
    // commander portraits, buylist thumbnails) via [data-card-view] on <html>.
    function mtgSyncCardViewLabel() {
      var view = document.documentElement.getAttribute("data-card-view");
      document.querySelectorAll("[data-cv-label]").forEach(function (el) {
        el.textContent = view === "text" ? "Texte" : "Images";
      });
    }
    function mtgToggleCardView() {
      var next = document.documentElement.getAttribute("data-card-view") === "text" ? "image" : "text";
      document.documentElement.setAttribute("data-card-view", next);
      localStorage.setItem("mtg-card-view", next);
      mtgSyncCardViewLabel();
    }
    mtgSyncCardViewLabel();

    // Drop-zone file inputs: show the picked filename inside the label.
    document.querySelectorAll(".dropzone").forEach(function (dz) {
      var input = dz.querySelector("input[type=file]");
      var text = dz.querySelector(".dz-text");
      if (!input || !text) return;
      var initial = text.innerHTML;
      input.addEventListener("change", function () {
        if (input.files && input.files.length) {
          dz.classList.add("has-file");
          text.textContent = "✓ " + input.files[0].name;
        } else {
          dz.classList.remove("has-file");
          text.innerHTML = initial;
        }
      });
    });

    // "Détails" button on commander cards: expand/collapse the card's
    // secondary sections (buylist + owned/linked card lists).
    function mtgToggleDetails(btn) {
      var card = btn.closest(".commander");
      if (!card) return;
      var all = card.querySelectorAll("details");
      var anyClosed = Array.prototype.some.call(all, function (d) { return !d.open; });
      all.forEach(function (d) { d.open = anyClosed; });
    }

    // Commander finder: collect the "Retenir" checkboxes ticked in the same
    // artifact and turn them into a chat message validating those commanders,
    // so the conversation resumes with the picked commander(s).
    function mtgValidatePicks(form) {
      var scope = form.closest(".commanders-finder") || document;
      var picks = Array.prototype.map.call(
        scope.querySelectorAll(".pick-commander:checked"),
        function (cb) { return cb.value; }
      );
      if (!picks.length) {
        alert("Coche au moins un commandant à retenir.");
        return false;
      }
      // " ; " between names: commander names contain commas themselves.
      form.querySelector("input[name=message]").value =
        (picks.length === 1
          ? "Je retiens le commandant « " + picks[0] + " »"
          : "Je retiens ces commandants : « " + picks.join(" » ; « ") + " »") +
        ". On continue la construction sur cette base, avec les cartes de ma collection qui conviennent.";
      return true;
    }

    // Click (or Enter/Space) a decklist row to reveal that card's image/text
    // below it. Event delegation on the document so it also covers chat
    // artifacts swapped into the thread after a background turn completes.
    function mtgToggleCardPreview(main) {
      var li = main.closest(".deck-line");
      var preview = li && li.querySelector(".deck-line-preview");
      if (!preview) return;
      var opening = preview.hasAttribute("hidden");
      if (opening) preview.removeAttribute("hidden");
      else preview.setAttribute("hidden", "");
      li.classList.toggle("open", opening);
      main.setAttribute("aria-expanded", opening ? "true" : "false");
    }
    document.addEventListener("click", function (ev) {
      var main = ev.target.closest && ev.target.closest(".deck-line-main");
      if (main) mtgToggleCardPreview(main);
    });
    document.addEventListener("keydown", function (ev) {
      if (ev.key !== "Enter" && ev.key !== " " && ev.key !== "Spacebar") return;
      var main = ev.target.closest && ev.target.closest(".deck-line-main");
      if (!main) return;
      ev.preventDefault();
      mtgToggleCardPreview(main);
    });

    // Copies the textarea inside the same .export block as `btn`, with
    // feedback on the button itself. Works over http (dev) via the
    // execCommand fallback since navigator.clipboard needs a secure context.
    function mtgCopyDecklist(btn) {
      const ta = btn.closest(".export").querySelector("textarea");
      const flash = (label) => {
        const original = btn.textContent;
        btn.textContent = label;
        btn.disabled = true;
        setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
      };
      const fallback = () => {
        ta.removeAttribute("readonly");
        ta.select();
        document.execCommand("copy");
        ta.setAttribute("readonly", "readonly");
        flash("✅ Copié !");
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(ta.value).then(() => flash("✅ Copié !")).catch(fallback);
      } else {
        fallback();
      }
    }
  </script>
</body>
</html>
