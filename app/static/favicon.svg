<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A Magic card back, stylised for 16-32 px: brown bordered card, the tan
       oval with the cream "Magic" script, the "the Gathering" ribbon and the
       blue Deckmaster globe below. -->
  <defs>
    <radialGradient id="field" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#7a4a22"/>
      <stop offset="1" stop-color="#3e2310"/>
    </radialGradient>
    <radialGradient id="oval" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#b9793d"/>
      <stop offset="1" stop-color="#6d3f1b"/>
    </radialGradient>
    <radialGradient id="globe" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#7fb2e8"/>
      <stop offset="1" stop-color="#1f3f7d"/>
    </radialGradient>
  </defs>
  <!-- card -->
  <rect x="10" y="1.5" width="44" height="61" rx="4" fill="#1f1108"/>
  <rect x="12.5" y="4" width="39" height="56" rx="3" fill="url(#field)" stroke="#c9995a" stroke-width="1"/>
  <!-- oval with the Magic script -->
  <ellipse cx="32" cy="24" rx="16.5" ry="12.5" fill="url(#oval)" stroke="#f0d49b" stroke-width="1.6"/>
  <ellipse cx="32" cy="24" rx="13.5" ry="9.5" fill="none" stroke="#3a2110" stroke-width="0.8" opacity="0.7"/>
  <text x="32" y="28.5" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif"
        font-style="italic" font-weight="700" font-size="13.5" fill="#f6e3b8" stroke="#2a1608" stroke-width="0.35">Magic</text>
  <!-- "the Gathering" ribbon -->
  <path d="M19 38.5 h26 l2.5 2.5 -2.5 2.5 h-26 l-2.5 -2.5 z" fill="#efd39a" stroke="#3a2110" stroke-width="0.8"/>
  <rect x="22" y="40.2" width="20" height="1.6" rx="0.8" fill="#7a4a22"/>
  <!-- Deckmaster globe -->
  <circle cx="32" cy="51.5" r="6" fill="url(#globe)" stroke="#f0d49b" stroke-width="1.2"/>
  <path d="M26.3 51.5 h11.4 M32 45.7 v11.6 M27.6 48.4 q4.4 2 8.8 0 M27.6 54.6 q4.4 -2 8.8 0"
        fill="none" stroke="#dce9fb" stroke-width="0.7" opacity="0.85"/>
</svg>
